schemaVersion: "2"
kind: sandbox
name: hermes-agent
displayName: Hermes Agent
description: Hermes Agent with host-managed provider credentials

# Inherit the built-in shell kit's provider credential mappings, proxy behavior,
# network defaults, and sandbox configuration.
extends: shell

sandbox:
  image: "docker.io/davidkarlsson416/hermes-agent-image:latest"
  # The shell parent appends `-l`. This launcher strips that inherited shell
  # argument before invoking Hermes.
  entrypoint:
    - /usr/local/bin/hermes-start

agentInstructions:
  filename: AGENTS.md

permissions:
  network:
    allow:
      - hermes-agent.nousresearch.com
      - github.com
      - raw.githubusercontent.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      - pypi.org
      - files.pythonhosted.org
      - astral.sh
      - '*.astral.sh'
      - portal.nousresearch.com
      - duckduckgo.com
      - archive.ubuntu.com
      - security.ubuntu.com
      - ports.ubuntu.com
      - download.docker.com

environment:
  variables:
    HERMES_HOME: /home/agent/.hermes
